<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFO Pond Watch</title>
<meta name="robots" content="noindex">
<!-- Prototype v1. Esri World Imagery fills the screen at every level; white cards float on top (GT Review look).
     Left: location cards that build up per level (world > country > state). Served by app/server.py at
     /static/proto/index_v1.html; reads the review app API, points.json and dash.json (scripts/proto_dashboard_data.py). -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,600..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#f4f7f5;--ink2:rgba(236,241,238,.82);--muted:rgba(226,233,229,.6);--line:rgba(255,255,255,.16);--forest:#ffffff;--box:rgba(255,255,255,.07);
  --glass:linear-gradient(145deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.09) 100%),rgba(18,20,24,.38);
  --glass-edge:rgba(255,255,255,.24);--glass-shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06);
  --blur:blur(26px) saturate(185%);
  --accent:#ec8454;--good:#2e9d5b;--bad:#d64545;--warn:#d99a00;
  --fd:"Archivo","Arial Narrow",sans-serif;--fb:Calibri,"Segoe UI",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0c0d;color:var(--ink);font:13.5px/1.4 var(--fb)}
button{font:inherit}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 45%,#16202b 0%,#0b1016 55%,#050608 100%)}
.leaflet-top.leaflet-left{left:258px;top:56px}
body.world .leaflet-top.leaflet-left{left:12px}
#lcol.anim{overflow:visible}
.lcard{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.lcard:hover{border-color:rgba(255,255,255,.5);box-shadow:var(--glass-shadow),0 0 0 1px rgba(255,255,255,.18)}
#lcol.anim .lcard{position:relative;z-index:2}
body.farm .leaflet-top.leaflet-left{top:118px}
.leaflet-control-attribution{font-size:10px}
.leaflet-bar{border:1px solid var(--glass-edge)!important;border-radius:12px!important;overflow:hidden;box-shadow:var(--glass-shadow)!important}
.leaflet-bar a{background:rgba(18,20,24,.5)!important;color:#fff!important;backdrop-filter:var(--blur);border-bottom-color:rgba(255,255,255,.15)!important}
.leaflet-tooltip{background:rgba(18,20,24,.75);color:#fff;border:1px solid var(--glass-edge);border-radius:8px;box-shadow:none}
.leaflet-tooltip-top:before{border-top-color:rgba(18,20,24,.75)}

/* ---- navbar: see-through, blurred ---- */
.nav{position:fixed;left:0;right:0;top:0;height:52px;z-index:1000;display:flex;align-items:center;gap:14px;padding:0 14px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(14,16,18,.32);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.2);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.nav .rsl{height:48px;padding:3px 10px;border-radius:12px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.nav .brand{font:800 19px/1 var(--fd);font-stretch:74%;letter-spacing:.01em;white-space:nowrap}
.nav .crumbs{font:500 12.5px var(--fm);color:#e6ece8;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.nav .crumbs a{color:#fff;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.4)}
.nav .crumbs img{height:14px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.nav .crumbs select,.nav .crumbs input{font:500 12px var(--fm);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.26);border-radius:8px;padding:3px 6px;outline:none;max-width:190px}
.nav .crumbs select{cursor:pointer}
.nav .crumbs input{width:170px}
.nav .crumbs input::placeholder{color:rgba(255,255,255,.55)}
.nav .crumbs select:hover,.nav .crumbs input:hover,.nav .crumbs input:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.nav .crumbs option{background:#1b1e22;color:#fff}
.nav .sp{flex:1}
.nav .step{display:flex;align-items:center;gap:6px;font:500 12px var(--fm)}
.nav .step button{all:unset;cursor:pointer;padding:3px 9px;border:1px solid rgba(255,255,255,.5);border-radius:4px}
.nav .step button:hover{background:rgba(255,255,255,.15)}
.nav .ct{height:13px;opacity:.95}

/* ---- floating cards (GT Review look) ---- */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-edge);border-radius:16px;box-shadow:var(--glass-shadow);padding:11px 13px;min-width:0;color:var(--ink)}
.card svg text{fill:rgba(236,241,238,.78)}
.card svg text.axt,.az-grid svg text.axt{fill:rgba(236,241,238,.58);font-weight:600;letter-spacing:.02em}
.card svg line:not(#areaYear){stroke:rgba(255,255,255,.13)}
.card svg rect[fill="#eef1ec"]{fill:rgba(255,255,255,.1)}
.card h3{margin:0 0 4px;font:700 11px/1.2 var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card .say{margin:2px 0 6px;color:var(--ink2);font-size:13px}
.card .say b{color:var(--ink)}
.card svg{display:block;width:100%}
.note{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.keys{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink2);margin-top:4px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:10px;height:10px;border-radius:2px;display:inline-block}
.card .keys svg{display:inline-block;width:20px;height:8px;overflow:visible}
.lead{display:grid;grid-template-columns:16px 1fr;gap:6px;color:var(--ink2);padding:5px 0;border-top:1px solid rgba(255,255,255,.1)}
.lead:first-of-type{border-top:0}
.lead b{color:var(--ink)}
.lead i{font-style:normal;color:var(--accent);font-family:var(--fm)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{display:flex;align-items:baseline;gap:4px 8px;margin-bottom:9px;flex-wrap:wrap}
.tier b,.tier .lvl,.tier .cmp{white-space:nowrap}
.tier b{font:800 22px/1 var(--fd);font-stretch:74%;color:#fff}
.tier .lvl{font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:var(--ink2)}
.tier .cmp{margin-left:auto;font:500 11px var(--fm);color:var(--muted)}
.kpi{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:7px 9px;min-width:0}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:500 20px/1.15 var(--fm);white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc{display:inline-block;font:500 11.5px var(--fm);padding:1px 8px;border-radius:999px;border:1px solid}
.flist{display:grid;gap:2px;max-height:280px;overflow:auto}
.fitem{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer}
.fitem:hover{background:rgba(255,255,255,.09)}
.fitem .id{font:500 12px var(--fm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem i{width:10px;height:10px;border-radius:50%;border:2.5px solid}
.fitem .m{color:var(--muted);font-size:11.5px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06);padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:4px 12px;font-weight:600;color:var(--ink2);border-radius:999px}
.seg button:hover{background:rgba(255,255,255,.1)}
.seg button.on{background:rgba(255,255,255,.88);color:#15181b;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ev-row{display:grid;grid-template-columns:12px 1fr;gap:8px;color:var(--ink2);padding:3px 0}
.ev-row i{width:10px;height:10px;border-radius:50%;margin-top:4px}
.ev-row b{color:var(--ink)}
@keyframes ballout{to{opacity:0}}
@keyframes lndraw{to{stroke-dashoffset:0}}
@keyframes dotin{to{opacity:1}}

/* left: location cards that build up per level */
#lcol{position:fixed;left:12px;top:64px;bottom:12px;width:236px;z-index:900;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:thin}
.lcard{padding:7px 9px;transition:opacity .35s}
.lcard .lt{display:flex;align-items:center;gap:6px;font-weight:700;color:#fff;margin-bottom:4px}
.lcard .lt img{height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.lcard .lt span{margin-left:auto;font:500 11px var(--fm);color:var(--muted)}
.lcard svg path.hit,.lcard svg .pinmini{cursor:pointer}
/* right: data cards */
#rcol{position:fixed;right:12px;top:64px;bottom:12px;width:380px;z-index:900;display:grid;gap:10px;align-content:start;overflow-y:auto;scrollbar-width:thin}
/* farm: footprint card in the middle, time series at the bottom */
.fbar{position:fixed;left:50%;transform:translateX(calc(-50% - 73px));top:64px;z-index:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 10px;border-radius:999px;max-width:calc(100vw - 690px)}
.fbar .bl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card.fbar{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;box-shadow:none;padding:0}   /* only the buttons are glass */
.fbar .seg{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glass-shadow)}
.fbar .bl{color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}
#yearbig .ys{display:block;margin-top:4px;font:500 11.5px var(--fm);color:#eef2ef}
.fbar{flex-direction:column;gap:5px}
.fbar .frow{display:flex;align-items:center;gap:8px}
.fyear{margin-left:4px;font:800 24px/1 var(--fd);font-stretch:70%;color:#fff;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap}
.fyear small{font:600 11px var(--fm);color:var(--warn);margin-left:4px}
.mapleg{position:fixed;left:258px;right:404px;bottom:226px;z-index:850;display:flex;gap:12px;flex-wrap:nowrap;justify-content:center;white-space:nowrap;overflow:hidden;font:500 9.5px var(--fm);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7);pointer-events:none}
.mapleg span{display:inline-flex;gap:6px;align-items:center}
.cbar{display:inline-flex;align-items:center;gap:5px}
.cbar .grad{position:relative;display:inline-block;width:150px;height:8px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.55);
  background:linear-gradient(90deg,#0d366b 0%,#2a78d6 16.25%,#9ec5f4 25%,#f0efec 32.5%,#f2b8b0 50%,#e34948 75%,#8f1f1f 100%)}
.cbar .grad u{position:absolute;left:32.5%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 2px #000}
.mapleg i{width:8px;height:8px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.leaflet-image-layer.s2img{image-rendering:pixelated}
.leaflet-image-layer.s2img.dim{filter:brightness(.45) saturate(.5)}
.plabel{font:700 12px/15px var(--fm);white-space:nowrap;padding:0 2px;text-shadow:1px 0 #fff,-1px 0 #fff,0 1px #fff,0 -1px #fff,1px 1px #fff,-1px -1px #fff,1px -1px #fff,-1px 1px #fff,0 0 4px #fff,0 0 7px rgba(255,255,255,.8);pointer-events:none}
.board{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.board .bl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.board .vk{font:500 12px var(--fm);color:var(--ink2)}
.stagebox{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.img{position:relative;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.25);max-width:100%;max-height:100%;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.zw{position:absolute}
.zw img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.zw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tag{position:absolute;font:500 11.5px var(--fm);padding:2px 6px;border-radius:4px;color:#0d0f10;white-space:nowrap;transform:translateY(-100%);pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.yearbig{position:absolute;right:12px;top:8px;font:800 44px/1 var(--fd);font-stretch:68%;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none}
.badge{position:absolute;left:12px;top:12px;font:500 11.5px var(--fm);padding:3px 8px;border-radius:6px;background:rgba(217,154,0,.92);color:#111}
.legend3{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px;min-height:20px;flex:none}
.legend3 span{display:inline-flex;gap:6px;align-items:center}
.legend3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
#time{position:fixed;left:258px;right:404px;bottom:12px;height:210px;z-index:900;overflow:hidden}
.striphead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.play{width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(236,132,84,.5)}
.thumbs{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.th{cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);transition:transform .15s}
.th:hover{transform:translateY(-2px)}
.th.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(236,132,84,.45)}
.th.thin{border-style:dashed;border-color:var(--warn)}
.th img{display:block;width:100%;height:122px;object-fit:cover;image-rendering:pixelated}
.th .y{display:flex;justify-content:space-between;padding:3px 6px 0;font:500 11px var(--fm);color:var(--ink2)}
.th .ev{padding:0 6px 4px;font:500 10px var(--fm);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.none{opacity:.35;cursor:default}

@media (max-width:900px){
  #lcol{display:none}
  #rcol{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:40vh}
  #time{left:8px;right:8px;bottom:calc(40vh + 16px)}
  .fbar{left:8px;right:8px;transform:none;max-width:none;border-radius:16px}
  #yearbig{right:16px;top:150px}
  .mapleg{left:8px;right:8px;bottom:calc(40vh + 236px)}
  .nav .crumbs,.nav .ct{display:none}
}
/* map markers */
.cmark{cursor:pointer;filter:drop-shadow(0 7px 5px rgba(0,0,0,.5))}
.cmark .pin{position:relative;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:radial-gradient(circle at 30% 25%,#ffffff,#eef1f4 50%,#b8c1ca);border:3px solid var(--c,#999);box-shadow:0 0 0 1.5px rgba(255,255,255,.55),0 0 16px var(--c,#999),inset -3px -3px 6px rgba(0,0,0,.22);transition:transform .15s}
.cmark .pin span{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg);font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.cmark:hover .pin{transform:rotate(-45deg) scale(1.18)}
.cmark .sh{width:20px;height:6px;margin:2px auto 0;border-radius:50%;background:radial-gradient(rgba(0,0,0,.75),transparent 70%)}
.chip{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--c);font:600 11px var(--fm);color:#fff;white-space:nowrap;box-shadow:var(--glass-shadow)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.slabel{display:inline-block;transform:translate(-50%,-50%);font:800 16px/1 var(--fd);letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none}
#globe,#globegl{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .7s;touch-action:none;cursor:grab}
body.globe #globe,body.globe #globegl{opacity:1}
body.globe #globe{pointer-events:auto}
#map{transition:opacity .7s,transform 1.1s cubic-bezier(.2,.7,.2,1)}
body.globe #map{opacity:0;pointer-events:none}
body.globe{background:radial-gradient(ellipse at 42% 52%,#14243a 0%,#080b10 62%,#050608 100%)}
body.tilt #map{transform:perspective(1700px) rotateX(22deg) scale(1.1);transform-origin:50% 62%}
body.tilt .leaflet-control-zoom{display:none}
.slabel span{display:block;font:500 10.5px var(--fm)}
.tip{position:fixed;z-index:2000;pointer-events:none;padding:6px 10px;border-radius:10px;font-size:12.5px;color:#fff;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.tip b{font-family:var(--fm);font-weight:500}
.tip .m{color:var(--ink2)}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:#ddd;background:#0b0c0d;z-index:3000;transition:opacity .4s}
</style></head><body>
<div id="map"></div>
<canvas id="globegl"></canvas>
<canvas id="globe"></canvas>
<header class="nav">
  <img class="rsl" src="img/rsl_logo_white.png" alt="SLU Remote Sensing Lab">
  <span class="brand">CAFO Pond Watch</span>
  <span class="crumbs" id="crumbs"></span>
  <span class="sp"></span>
  <span class="step" id="step" hidden><button id="fprev" title="Previous farm">◀</button><span id="fpos"></span><button id="fnext" title="Next farm">▶</button></span>
  <img class="ct" src="img/climatetrace_logo.svg" alt="Climate TRACE">
</header>
<aside id="lcol">
  <div class="card lcard" id="cGlobal" hidden><div class="lt">World<span id="gSub"></span></div><svg id="gsvg"></svg></div>
  <div class="card lcard" id="cCountry" hidden><div class="lt" id="cTitle"></div><svg id="csvg"></svg></div>
  <div class="card lcard" id="cState" hidden><div class="lt" id="sTitle"></div><svg id="ssvg"></svg></div>
</aside>
<aside id="rcol"></aside>
<div class="card fbar" id="mid" hidden>
  <div class="frow">
    <span class="bl">View</span><span class="seg" id="zoomseg"><button data-z="farm" class="on">Whole farm</button><button data-z="ponds">Ponds</button></span>
    <span class="bl">Image</span><span class="seg" id="modes"><button data-m="s2" class="on">Sentinel-2 + ponds</button><button data-m="bsi">BSI-E</button><button data-m="fill">Pond change</button></span>
    <span class="fyear" id="yearbig"></span>
  </div>
</div>
<div class="mapleg" id="leg" hidden></div>
<section class="card" id="time" hidden>
  <div class="striphead"><button class="play" id="play" aria-label="Play years">▶</button><h3 style="margin:0" id="stripk">Summer image each year</h3></div>
  <div class="thumbs" id="thumbs"></div>
</section>
<div class="tip" id="tip" hidden></div>
<div class="loading" id="loading">Loading…</div>

<script src="vendor/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
"use strict";
// ======================================================================= setup
const $ = (s) => document.querySelector(s);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 0) => v == null || Number.isNaN(v) ? "–" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (v) => v == null || !isFinite(v) ? "–" : `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(0)}%`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const human = (s) => s ? String(s).replace(/^proposed:/, "").replace(/_/g, " ") : "–";
const titleCase = (s) => human(s).replace(/\b\w/g, (m) => m.toUpperCase());
const COUNTRIES = {

// ======================================================================= routing
function setHash() {
  const q = new URLSearchParams();
  if (S.c) q.set("c", S.c); if (S.st) q.set("s", S.st); if (S.op) q.set("op", S.op);
  const h = q.toString();
  if (location.hash.slice(1) !== h) history.pushState(null, "", h ? "#" + h : location.pathname);
}
function route() {
  const q = new URLSearchParams(location.hash.slice(1)), c = q.get("c"), st = q.get("s"), op = q.get("op");
  if (op && PTS.find((p) => p.op === op && p.img)) goFarm(op, false);
  else if (c === "USA" && st && shown("USA", st).length) goState(st, false);
  else if (c && ACTIVE.has(c)) goCountry(c, false);
  else goWorld(false);
}
addEventListener("popstate", route);
function setLevel(v) {
  S.view = v; hideTip(); stopPlay();
  document.body.classList.toggle("world", v === "world");
  document.body.classList.toggle("globe", USE_GLOBE && v === "world");
  document.body.classList.toggle("tilt", v === "country" || v === "state");   // slight 3D at country and state, flat at farm
  showCard($("#cGlobal"), v !== "world", true);
  showCard($("#cCountry"), v === "state" || v === "farm", true);   // a small card appears only once you go below its level
  showCard($("#cState"), v === "farm", true);
  $("#mid").hidden = $("#time").hidden = v !== "farm";
  $("#step").hidden = v !== "farm";
  document.body.classList.toggle("farm", v === "farm");
  MAP.removeLayer(REF);
  CTX.clearLayers(); FARM.clearLayers();
  PLAB.clearLayers(); F.labs = null; $("#leg").hidden = v !== "farm";
  crumbs(); drawGlobalCard(); if (S.c) drawCountryCard(); if (v === "farm") drawStateCard();
}
const lcolDone = () => { if (![...document.querySelectorAll("#lcol .lcard")].some((c) => c._anim)) $("#lcol").classList.remove("anim"); };
function showCard(el, on, fromMap) {   // fromMap: the card grows out of / back into the full-screen map
  if (el._anim) { el._anim.cancel(); el._anim = null; lcolDone(); }
  if (on === !el.hidden) return;
  const big = () => { const r = el.getBoundingClientRect();
    return `translate(${innerWidth / 2 - r.left - r.width / 2}px,${innerHeight / 2 - r.top - r.height / 2}px) scale(${innerWidth / r.width})`; };
  if (on) {
    el.hidden = false;
    const k = fromMap ? [{ transform: big(), opacity: 0 }, { opacity: .55, offset: .3 }, { transform: "none", opacity: 1 }]
      : [{ transform: "translateX(-28px)", opacity: 0 }, { transform: "none", opacity: 1 }];
    if (fromMap) $("#lcol").classList.add("anim");
    el._anim = el.animate(k, { duration: fromMap ? 1050 : 450, delay: fromMap ? 0 : 250, fill: "backwards", easing: "cubic-bezier(.2,.75,.2,1)" });
    el._anim.onfinish = () => { el._anim = null; lcolDone(); };
  } else if (fromMap) {
    $("#lcol").classList.add("anim");
    el._anim = el.animate([{ transform: "none", opacity: 1 }, { transform: big(), opacity: 0 }], { duration: 650, easing: "cubic-bezier(.5,0,.75,0)" });
    el._anim.onfinish = () => { el.hidden = true; el._anim = null; lcolDone(); };
  } else el.hidden = true;
}
function crumbs() {   // World > country menu > state menu > farm ID (type to filter)
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const parts = [S.view === "world" ? "<b>World</b>" : `<a data-go="world">World</a>`, "›"];
  parts.push(`${S.c ? flagImg(S.c) : ""}<select id="selC" title="Country">${!S.c ? opt("", "Country…", true) : S.view !== "country" ? opt("^", `‹ ${COUNTRIES[S.c].name} overview`) : ""}` +
    [...ACTIVE].sort((a, b) => COUNTRIES[a].name.localeCompare(COUNTRIES[b].name)).map((c) => opt(c, COUNTRIES[c].name, c === S.c)).join("") + `</select>`);
  if (S.c === "USA") {
    const sts = [...new Set(shown("USA").map((p) => p.region.split("/")[1]))].sort();
    parts.push("›", `<select id="selS" title="State">${!S.st ? opt("", "State…", true) : S.view !== "state" ? opt("^", `‹ ${titleCase(S.st)} overview`) : ""}` +
      sts.map((s2) => opt(s2, titleCase(s2), s2 === S.st)).join("") + `</select>`);
  }
  const ids = PTS.filter((p) => p.img).sort((a, b) => ((b.c === S.c) - (a.c === S.c)) || a.op.localeCompare(b.op));
  parts.push("›", `<input id="selF" list="farmIds" placeholder="Farm ID…" value="${esc(S.op || "")}" spellcheck="false" autocomplete="off" title="Type or pick a farm ID">` +
    `<datalist id="farmIds">${ids.map((p) => `<option value="${esc(p.op)}">${esc(human(p.region))}</option>`).join("")}</datalist>`);
  $("#crumbs").innerHTML = parts.join(" ");

  $("#selC").onchange = (e) => { const v = e.target.value; if (v === "^") goCountry(S.c); else if (v) goCountry(v); };
  const ss = $("#selS"); if (ss) ss.onchange = (e) => { const v = e.target.value; if (v === "^") goState(S.st); else if (v) goState(v); };
  const f = $("#selF"), pick = () => { const v = f.value.trim(); if (v && v !== S.op && PTS.some((p) => p.op === v && p.img)) goFarm(v); };
  f.oninput = pick; f.onchange = pick; f.onkeydown = (e) => { if (e.key === "Enter") { const v = f.value.trim().toLowerCase(), m = ids.find((p) => p.op.toLowerCase().includes(v)); if (m) goFarm(m.op); } };
  f.onfocus = () => f.select();
}

function cardSvg(sel, h) { const svg = d3.select(sel); svg.selectAll("*").remove(); const W = 270; svg.attr("viewBox", `0 0 ${W} ${h}`); return [svg, W, h]; }

    svg.append("text").attr("x", Math.min(W - 40, x + 8)).attr("y", y - 6).attr("font-size", 11).attr("font-weight", 700).attr("fill", "#fff").attr("paint-order", "stroke").attr("stroke", "rgba(0,0,0,.7)").attr("stroke-width", 3).text(S.c); }

function drawCountryCard() {
